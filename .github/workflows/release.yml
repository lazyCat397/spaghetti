name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build spg
        run: cargo build --release

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item target/release/spg.exe installer/payload/spg.exe
          Copy-Item "dist/spaghetti-${{ steps.ver.outputs.version }}.vsix" installer/payload/spaghetti.vsix
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer/spaghetti.iss"
          Move-Item "installer/spaghetti-${{ steps.ver.outputs.version }}.exe" "release-out/spaghetti-${{ steps.ver.outputs.version }}-windows-setup.exe"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p pkg/spaghetti release-out
          cp target/release/spg pkg/spaghetti/
          cp "dist/spaghetti-${{ steps.ver.outputs.version }}.vsix" pkg/spaghetti/spaghetti.vsix
          cp installer/install-linux.sh pkg/spaghetti/install.sh
          tar -czf "release-out/spaghetti-${{ steps.ver.outputs.version }}-linux.tar.gz" -C pkg spaghetti

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release-out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release to the public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo lazyCat397/spaghetti-releases \
            --title "Spaghetti $TAG" \
            --notes "Spaghetti $TAG. Download the installer for Windows or the package for Linux."
