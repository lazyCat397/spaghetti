name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # gate: nothing is built or published unless the Rust tests and the multi-file suite pass
  # on Windows the suite runs too (Git Bash), so the native code is tested where users run it
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust tests
        run: cargo test --workspace

      # the suite runs the RELEASE binary at target/release/spg, which cargo test does not build
      - name: Build release binary
        run: cargo build --release

      - name: Multi-file suite - default, native code on
        shell: bash
        run: bash examples/multi/run.sh

      # same suite with the VM only: the fallback must stay correct too
      - name: Multi-file suite (--no-jit)
        shell: bash
        run: |
          REAL="$(pwd)/target/release/spg"
          WRAP="$RUNNER_TEMP/spg-novm"
          cat > "$WRAP" <<EOF
          #!/bin/bash
          case "\$1" in
            run) shift; exec "$REAL" run --no-jit "\$@" ;;
            check|build|fmt|lsp) exec "$REAL" "\$@" ;;
            *) exec "$REAL" "\$1" --no-jit "\${@:2}" ;;
          esac
          EOF
          chmod +x "$WRAP"
          SPG="$WRAP" bash examples/multi/run.sh

  # the .vsix is generated here, not committed to the repository
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the extension version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$TAG\"" editors/vscode/package.json

      - name: Package the extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license -o "$RUNNER_TEMP/spaghetti.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/spaghetti.vsix

  build:
    needs: [test, vsix]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Build spg
        run: cargo build --release

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item target/release/spg.exe installer/payload/spg.exe
          Copy-Item vsix/spaghetti.vsix installer/payload/spaghetti.vsix
          New-Item -ItemType Directory -Force installer/payload/stdlib | Out-Null
          Copy-Item stdlib/* installer/payload/stdlib/
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer/spaghetti.iss"
          Move-Item "installer/spaghetti-${{ steps.ver.outputs.version }}.exe" "release-out/spaghetti-${{ steps.ver.outputs.version }}-windows-setup.exe"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p pkg/spaghetti release-out
          cp target/release/spg pkg/spaghetti/
          cp vsix/spaghetti.vsix pkg/spaghetti/spaghetti.vsix
          cp -r stdlib pkg/spaghetti/stdlib
          cp installer/install-linux.sh pkg/spaghetti/install.sh
          tar -czf "release-out/spaghetti-${{ steps.ver.outputs.version }}-linux.tar.gz" -C pkg spaghetti

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release-out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release to the public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO=lazyCat397/spaghetti-releases
          NOTES="Spaghetti $TAG. Download the installer for Windows or the package for Linux."
          # a re-run (or a re-publish of the same tag) must not fail on "release already exists":
          # replace the assets and the notes of the existing release instead
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$REPO"
            gh release edit "$TAG" --repo "$REPO" --title "Spaghetti $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" assets/* --repo "$REPO" --title "Spaghetti $TAG" --notes "$NOTES"
          fi
