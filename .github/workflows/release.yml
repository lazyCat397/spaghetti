name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # gate: nothing is built or published unless the Rust tests and the multi-file suite pass
  # on Windows the suite runs too (Git Bash), so the native code is tested where users run it
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # the tag is the version: a `v1.1.0` tag built from a Cargo.toml that says 1.0.0 would ship the wrong binary
      - name: Cargo.toml version matches the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"$TAG\"$" Cargo.toml || { echo "Cargo.toml version is not $TAG"; exit 1; }

      - name: Locate the Windows resource compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $rc) { throw 'rc.exe not found: the Windows SDK is needed for the spgw icon' }
          "RC=$($rc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust tests
        run: cargo test --workspace

      # the suite runs the RELEASE binary at target/release/spg, which cargo test does not build
      - name: Build release binary
        run: cargo build --release

      - name: Multi-file suite - default, native code on
        shell: bash
        run: bash tests/run.sh

      # same suite with the VM only: the fallback must stay correct too
      - name: Multi-file suite (--no-jit)
        shell: bash
        run: |
          REAL="$(pwd)/target/release/spg"
          WRAP="$RUNNER_TEMP/spg-novm"
          cat > "$WRAP" <<EOF
          #!/bin/bash
          case "\$1" in
            run) shift; exec "$REAL" run --no-jit "\$@" ;;
            check|build|fmt|lsp) exec "$REAL" "\$@" ;;
            *) exec "$REAL" "\$1" --no-jit "\${@:2}" ;;
          esac
          EOF
          chmod +x "$WRAP"
          # only the files where the JIT compiles code need this second run (tests/jit-list.txt)
          NOJIT_ONLY=1 SPG="$WRAP" bash tests/run.sh

  # the .vsix is generated here, not committed to the repository
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the extension version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$TAG\"" editors/vscode/package.json

      - name: Package the extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@3.9.2 package --allow-missing-repository --skip-license -o "$RUNNER_TEMP/spaghetti.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ runner.temp }}/spaghetti.vsix

  build:
    needs: [test, vsix]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Read version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Build spg
        run: cargo build --release

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item target/release/spg.exe installer/payload/spg.exe
          Copy-Item target/release/spgw.exe installer/payload/spgw.exe
          Copy-Item vsix/spaghetti.vsix installer/payload/spaghetti.vsix
          New-Item -ItemType Directory -Force installer/payload/stdlib | Out-Null
          Copy-Item stdlib/* installer/payload/stdlib/
          New-Item -ItemType Directory -Force installer/payload/examples | Out-Null
          Copy-Item -Recurse examples/* installer/payload/examples/
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer/spaghetti.iss"
          Move-Item "installer/spaghetti-${{ steps.ver.outputs.version }}.exe" "release-out/spaghetti-${{ steps.ver.outputs.version }}-windows-setup.exe"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p pkg/spaghetti release-out
          cp target/release/spg pkg/spaghetti/
          cp target/release/spgw pkg/spaghetti/
          cp vsix/spaghetti.vsix pkg/spaghetti/spaghetti.vsix
          cp -r stdlib pkg/spaghetti/stdlib
          cp -r examples pkg/spaghetti/examples
          cp installer/install-linux.sh pkg/spaghetti/install.sh
          tar -czf "release-out/spaghetti-${{ steps.ver.outputs.version }}-linux.tar.gz" -C pkg spaghetti

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release-out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # the only job that writes: the GITHUB_TOKEN may create the release in this repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the notes list the commits since the previous tag

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true


      - name: Publish release to the public repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO="${{ github.repository }}"
          NOTES="## Spaghetti $TAG"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$REPO"
            gh release edit "$TAG" --repo "$REPO" --title "Spaghetti $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" assets/* --repo "$REPO" --title "Spaghetti $TAG" --notes "$NOTES"
          fi
