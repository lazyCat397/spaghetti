name: release

# Dispara quando você cria uma tag tipo v0.16.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão (a partir da tag)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar spg
        run: cargo build --release

      - name: Gerar instalador (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          Copy-Item target/release/spg.exe installer/payload/spg.exe
          Copy-Item "dist/spaghetti-${{ steps.ver.outputs.version }}.vsix" installer/payload/spaghetti.vsix
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer/spaghetti.iss"
          Rename-Item "installer/spaghetti-${{ steps.ver.outputs.version }}.exe" "spaghetti-${{ steps.ver.outputs.version }}-windows-setup.exe"

      - name: Empacotar (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p pkg/spaghetti
          cp target/release/spg pkg/spaghetti/
          cp "dist/spaghetti-${{ steps.ver.outputs.version }}.vsix" pkg/spaghetti/spaghetti.vsix
          cp installer/install-linux.sh pkg/spaghetti/install.sh
          tar -czf "spaghetti-${{ steps.ver.outputs.version }}-linux.tar.gz" -C pkg spaghetti

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            *-setup.exe
            installer/*-setup.exe
            *-linux.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publicar release no repositório público
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* \
            --repo lazyCat397/spaghetti-releases \
            --title "Spaghetti $TAG" \
            --notes "Versão $TAG da linguagem Spaghetti. Baixe o instalador para Windows ou o pacote para Linux."
