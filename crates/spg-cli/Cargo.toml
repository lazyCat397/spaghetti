[package]
name = "spg-cli"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "spg"
path = "src/main.rs"

[lib]
name = "spg_cli"
path = "src/lib.rs"

[[bin]]
name = "spgw"
path = "src/bin/spgw.rs"

[dependencies]
spg-lexer = { path = "../spg-lexer" }
spg-parser = { path = "../spg-parser" }
spg-modules = { path = "../spg-modules" }
spg-typecheck = { path = "../spg-typecheck" }
spg-compiler = { path = "../spg-compiler" }
spg-vm = { path = "../spg-vm" }
spg-lsp = { path = "../spg-lsp" }
spg-fmt = { path = "../spg-fmt" }
spg-jit = { path = "../spg-jit" }
