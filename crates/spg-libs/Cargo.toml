[package]
name = "spg-libs"
version.workspace = true
license.workspace = true
edition.workspace = true

# the libraries that ship with the engine but are NOT part of the language (ps, http, ...).
# this crate depends on no other spg crate: a lib only knows plain Rust values (`LibValue`).
[features]
# the heavy libraries are features. `all` turns them on (spg-cli does, by default).
# nothing on: only the core libraries (ps, file, json, time, chars, cmd, socket, testing, json5),
# which is what `spg-lean` gets
default = []
all = ["http", "regex", "crypto", "csv", "toml", "sqlite", "ui"]
http = ["dep:ureq"]
regex = ["dep:regex"]
crypto = ["dep:sha1", "dep:sha2", "dep:md-5", "dep:hmac", "dep:base64", "dep:hex", "dep:getrandom", "dep:aes-gcm", "dep:argon2", "dep:base64ct"]
csv = ["dep:csv"]
toml = ["dep:toml", "dep:indexmap"]
sqlite = ["dep:rusqlite"]
ui = ["dep:ui-core"]

[dependencies]
# http: blocking client with rustls (TLS). pinned: 3.2.1 is the last release that builds on Rust 1.75
ureq = { version = "=3.2.1", default-features = false, features = ["rustls", "platform-verifier", "gzip"], optional = true }

# regex: the pattern engine behind `attach #regex`. linear time, so no pattern hangs a match
regex = { version = "1.11", optional = true }
# crypto: hashes, keyed hashes, encodings, random values and password encryption for
# `attach #crypto` (the RustCrypto family, all on Rust 1.75)
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }
getrandom = { version = "0.2", optional = true }
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
# pinned: base64ct 1.8 needs edition 2024 (Rust 1.85); 1.6.0 is the last that builds here
base64ct = { version = "=1.6.0", optional = true }
# csv: for `attach #csv`
csv = { version = "1.3", optional = true }
# toml: reads config files for `attach #toml`. parser only, no serializer
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }
# pinned: indexmap 2.14 needs a newer Rust than 1.75; 2.2.6 is the last that builds here
indexmap = { version = "=2.2.6", optional = true }
# ui: the window core for `attach #ui`. the real backend is minifb, checked by hand on Windows
ui-core = { path = "../ui-core", features = ["minifb"], optional = true }
# sqlite: a database in one file, for `attach #sqlite`. "bundled" compiles SQLite itself, so only a C compiler is needed
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
