[package]
name = "spg-libs"
version.workspace = true
license.workspace = true
edition.workspace = true

# the libraries that ship with the engine but are NOT part of the language (ps, http, ...).
# this crate depends on no other spg crate: a lib only knows plain Rust values (`LibValue`).
[dependencies]
# http: blocking client with rustls (TLS). pinned: 3.2.1 is the last release that builds on Rust 1.75
ureq = { version = "=3.2.1", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

# regex: the pattern engine behind `install #regex`. linear time, so no pattern hangs a match
regex = "1.11"
# crypto: hashes and encodings for `install #crypto` (the RustCrypto family, all on Rust 1.75)
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
# csv: for `install #csv`
csv = "1.3"
# toml: reads config files for `install #toml`. parser only, no serializer
toml = { version = "0.8", default-features = false, features = ["parse"] }
# pinned: indexmap 2.14 needs a newer Rust than 1.75; 2.2.6 is the last that builds here
indexmap = "=2.2.6"
# ui: the window core for `install #ui`. the real backend is minifb, checked by hand on Windows
ui-core = { path = "../ui-core", features = ["minifb"] }
# sqlite: a database in one file, for `install #sqlite`. "bundled" compiles SQLite itself, so only a C compiler is needed
rusqlite = { version = "0.31", features = ["bundled"] }
