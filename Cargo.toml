[workspace]
resolver = "2"
members = [
    "crates/spg-lexer",
    "crates/spg-parser",
    "crates/spg-modules",
    "crates/spg-typecheck",
    "crates/spg-compiler",
    "crates/spg-vm",
    "crates/spg-lsp",
    "crates/spg-fmt",
    "crates/spg-cli",
    "crates/spg-jit",
]

[workspace.package]
version = "1.26.0"
edition = "2021"

[profile.release]
# strip: only removes symbols from the executable.
# lto = "thin" (was "fat"): fat LTO re-optimizes the whole program on every release build and
# made CI and the local update script slow; thin keeps most of the gain at a fraction of the time.
# DO NOT add codegen-units = 1: measured 0.80x (slower on every benchmark).
strip = true
lto = "thin"
